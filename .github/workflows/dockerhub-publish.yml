name: Publish Docker image to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Docker Hub repository (namespace/name)."
        required: false
        type: string
      extra_tags:
        description: "Optional newline-separated extra tags for docker/metadata-action."
        required: false
        type: string

env:
  DEFAULT_IMAGE_REPOSITORY: ${{ github.repository_owner }}/cfct-webapp
  IMAGE_NAME: cfct-webapp

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image repository
        id: image
        shell: bash
        env:
          INPUT_IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          image_repo="${INPUT_IMAGE_REPOSITORY:-}"
          if [ -z "$image_repo" ]; then
            image_repo="${DEFAULT_IMAGE_REPOSITORY}"
          fi
          echo "repository=${image_repo}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::Missing required secret: DOCKERHUB_USERNAME"
            missing=1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Missing required secret: DOCKERHUB_TOKEN"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ inputs.extra_tags }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cfct-webapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
